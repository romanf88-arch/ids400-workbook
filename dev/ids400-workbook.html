var numDirect=(slot>>>1)-1;
var dist=((2|(slot&1))*Math.pow(2,numDirect));
if(slot<14)return dist+reverse(posDec,dist-slot,numDirect);
return dist+direct(numDirect-4)*16+reverse(align,0,4);
}
var lpMask=(1<<lp)-1;
var pbMask=(1<<pb)-1;
var rep0=0,rep1=0,rep2=0,rep3=0;
var state=0;
while(pos<size){
var posState=pos&pbMask;
if(bit(isMatch,(state<<4)+posState)===0){
var prev=pos>0?out[pos-1]:0;
var base=0x300*(((pos&lpMask)<<lc)+(prev>>>(8-lc)));
var sym=1;
if(state>=7){
if(rep0+1>pos)throw new LzmaError('distance');
var matchByte=out[pos-rep0-1];
do{
var matchBit=(matchByte>>>7)&1;
matchByte<<=1;
var b2=bit(lit,base+((1+matchBit)<<8)+sym);
sym=(sym<<1)|b2;
if(matchBit!==b2)break;
}while(sym<0x100);
}
while(sym<0x100)sym=(sym<<1)|bit(lit,base+sym);
out[pos++]=sym-0x100;
state=state<4?0:(state<10?state-3:state-6);
continue;
}
var len;
if(bit(isRep,state)!==0){
if(pos===0)throw new LzmaError('rep at start');
if(bit(isRepG0,state)===0){
if(bit(isRep0Long,(state<<4)+posState)===0){
state=state<7?9:11;
out[pos]=out[pos-rep0-1];
pos++;
continue;
}
}else{
var dist;
if(bit(isRepG1,state)===0)dist=rep1;
else{
if(bit(isRepG2,state)===0)dist=rep2;
else{dist=rep3;rep3=rep2;}
rep2=rep1;
}
rep1=rep0;
rep0=dist;
}
len=lenDecode(repLenDec,posState);
state=state<7?8:11;
}else{
rep3=rep2;
rep2=rep1;
rep1=rep0;
len=lenDecode(lenDec,posState);
state=state<7?7:10;
rep0=distance(len);
if(rep0===0xFFFFFFFF)break;
}
len+=2;
if(rep0+1>pos)throw new LzmaError('distance');
if(pos+len>size)throw new LzmaError('output too long');
var from=pos-rep0-1;
for(var j=0;j<len;j++)out[pos+j]=out[from+j];
pos+=len;
}
if(pos!==size)throw new LzmaError('output too short');
return out;
}
function fail(){
if(failed)return;
failed=true;
var body=document.body;
if(bootStyle&&!bootStyle.parentNode)document.head.appendChild(bootStyle);
if(!bootBox){
bootBox=document.createElement('div');
bootBox.id='wb-boot';
bootBox.className='wb-boot';
}
var msg=bootBox.querySelector('#wb-boot-msg');
if(!msg){
msg=document.createElement('p');
msg.id='wb-boot-msg';
msg.setAttribute('role','status');
msg.setAttribute('aria-live','polite');
bootBox.appendChild(msg);
}
if(bootBox.parentNode){
msg.textContent=C.failed;
}else{
msg.textContent='';
body.insertBefore(bootBox,body.firstChild);
setTimeout(function(){msg.textContent=C.failed;},50);
}
if(C.link){
var p=document.createElement('p');
var a=document.createElement('a');
var note=document.createElement('span');
a.href=C.link;
a.target='_blank';
a.rel='noopener';
a.appendChild(document.createTextNode(C.linkText+' '));
note.className='note';
note.textContent=C.newTab;
a.appendChild(note);
p.appendChild(a);
bootBox.appendChild(p);
}
}
function base64Bytes(text){
var s=atob(text);
var out=new Uint8Array(s.length);
for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i);
return out;
}
function readPack(bytes){
if(bytes.length!==C.bytes)throw new Error('length');
var p=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
var ok=p&&typeof p.style==='string'&&typeof p.script==='string'&&Array.isArray(p.data)&&
p.data.every(function(d){return Array.isArray(d)&&typeof d[0]==='string'&&typeof d[1]==='string';});
if(!ok)throw new Error('shape');
return p;
}
function unpack(input){
return readPack(lzmaDecode(input,C.bytes,{lc:C.lc,lp:C.lp,pb:C.pb}));
}
function run(p){
var pack=document.getElementById(C.pack);
var parent=pack.parentNode;
var style=document.createElement('style');
style.textContent=p.style;
document.head.insertBefore(style,bootStyle&&bootStyle.parentNode===document.head?bootStyle:null);
p.data.forEach(function(d){
var s=document.createElement('script');
s.type='application/json';
s.id=d[0];
s.textContent=d[1];
parent.insertBefore(s,pack);
});
parent.removeChild(pack);
if(me&&me.parentNode)me.parentNode.removeChild(me);
if(bootBox&&bootBox.parentNode)bootBox.parentNode.removeChild(bootBox);
if(bootStyle&&bootStyle.parentNode)bootStyle.parentNode.removeChild(bootStyle);
var app=document.createElement('script');
app.textContent=p.script;
parent.appendChild(app);
var built=window.WB&&window.WB.build;
if(!built||built.VERSION!==C.version)fail();
}
function go(p){
try{
run(p);
}catch(e){
fail();
}
}
var input;
try{
input=base64Bytes(document.getElementById(C.pack).textContent);
}catch(e){
fail();
return;
}
setTimeout(function(){
var p;
try{
p=unpack(input);
}catch(e){
fail();
return;
}
go(p);
},0);
})();
</script>
