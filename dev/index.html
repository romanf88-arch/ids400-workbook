<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-kj2Y9HBr9XctPEtv4+j32u4//u3Ya9ck378Iuh5JVeM='; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<title>IDS 400 Capstone Workbook</title>
<style>
:root {
color-scheme: light;
--navy: #002649; --ink: #1f2933; --muted: #4a5560; --link: #114a72;
--bg: #f6f4ef; --surface: #ffffff; --surface-2: #f4f7fa; --line: #d5dbe1; --field-line: #6f7b88;
--gold: #f1c40f; --goldsoft: #fdf6d8;
--ok-ink: #1d5e33; --ok-bg: #e7f4ea; --ok-line: #7fbf95;
--no-ink: #8a2a1c; --no-bg: #fdecea; --no-line: #e3a397;
--warn-ink: #6b4e00; --warn-bg: #fdf6d8; --warn-line: #d9b44a;
--wait-ink: #4a5560; --wait-bg: #eef1f4;
--focus: #1a5fb4;
--header-bg: #002649; --header-ink: #ffffff; --header-muted: #e8edf3; --header-focus: #f1c40f;
--heading: #002649;
--btn-bg: #002649; --btn-ink: #ffffff; --btn2-bg: #ffffff; --btn2-ink: #002649; --btn2-hover: #eef3f8;
--radius: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
margin: 0; background: var(--bg); color: var(--ink);
font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Lato, Arial, sans-serif;
overflow-wrap: anywhere;
}
a { color: var(--link); }
a:not(.btn) { min-height: 24px; display: inline-block; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.visually-hidden {
position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
clip-path: inset(50%); white-space: nowrap; border: 0;
}
h1 { color: var(--heading); font-size: 1.6rem; line-height: 1.25; margin: 0 0 10px; }
h2 { color: var(--heading); font-size: 1.3rem; line-height: 1.3; margin: 0 0 8px; }
h3 { color: var(--heading); font-size: 1.1rem; line-height: 1.35; margin: 18px 0 6px; }
h4 { color: var(--heading); font-size: 1rem; margin: 14px 0 4px; }
p { margin: 0 0 10px; }
[tabindex="-1"]:focus { outline: none; }
[tabindex="-1"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1[tabindex="-1"]:focus-visible { outline: none; }
.skip-link {
position: absolute; left: 8px; top: -100px; z-index: 10; background: var(--surface); color: var(--link);
padding: 8px 12px; border-radius: 6px; border: 2px solid var(--focus);
}
.skip-link:focus { top: 8px; }
.wb-header { background: var(--header-bg); color: var(--header-ink); border-bottom: 5px solid var(--gold); }
.wb-header-inner {
max-width: 860px; margin: 0 auto; padding: 10px 16px 12px;
display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
}
.wb-header :focus-visible { outline-color: var(--header-focus); }
.wb-titles { flex: 1 1 260px; min-width: 0; }
.wb-course { margin: 0; font-size: .85rem; color: var(--header-muted); }
.wb-view { margin: 0; font-weight: 700; font-size: 1.05rem; color: var(--header-ink); }
.wb-view { display: none; }
.wb-nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.wb-nav a { color: var(--header-ink); padding: 2px 0; }
.wb-status-row { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.save-status {
margin: 0; display: inline-flex; gap: 6px; align-items: baseline; font-size: .93rem;
padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, .1); color: var(--header-ink);
}
.save-status .sym { font-weight: 800; }
.save-status[data-state="ok"] .sym { color: #9fe0b2; }
.save-status[data-state="warn"] { background: #fdf6d8; color: #4a3600; }
.save-status[data-state="error"] { background: #fdecea; color: #7a2418; font-weight: 600; }
.save-note { margin: 0; flex: 1 1 100%; font-size: .9rem; padding: 2px 10px; border-radius: 6px; background: #fdf6d8; color: #4a3600; }
.save-note::before { content: "! "; font-weight: 800; }
.save-note[hidden] { display: none; }
.wb-actions { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; }
.wb-main { display: block; max-width: 860px; margin: 0 auto; padding: 16px; }
.wb-main:focus { outline: none; }
.panel, section.step, .issue {
background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
padding: 16px 18px; margin: 0 0 16px;
}
.issue { border-left: 6px solid var(--warn-line); }
.dates { color: var(--muted); font-size: .95rem; }
.note { color: var(--muted); font-size: .93rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.row.tight { margin-top: 6px; gap: 6px; }
.spacer { flex: 1; }
.more-links { margin: 0; padding-left: 1.2em; }
.more-links li { margin: 4px 0; }
.error-text { color: var(--no-ink); font-weight: 600; }
.wb-tools { max-width: 860px; margin: 28px auto 0; padding: 14px 16px 8px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
.copy-panel { max-width: 860px; margin: 12px auto 0; padding: 0 16px; }
.copy-panel > * { max-width: 100%; }
.copy-panel { background: transparent; }
.copy-panel > h2, .copy-panel > p, .copy-panel > .copybox, .copy-panel > .row { margin-left: 0; }
.btn {
font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px;
background: var(--btn-bg); color: var(--btn-ink); cursor: pointer; min-height: 44px; min-width: 44px;
text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn.secondary { background: var(--btn2-bg); color: var(--btn2-ink); border: 2px solid var(--btn2-ink); padding: 8px 16px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .92rem; }
.btn.secondary.small { padding: 4px 10px; }
.btn:hover { filter: brightness(1.12); }
.btn.secondary:hover { background: var(--btn2-hover); filter: none; }
.btn.on-dark { background: transparent; color: var(--header-ink); border: 2px solid var(--header-ink); }
.btn.on-dark:hover { background: rgba(255, 255, 255, .14); filter: none; }
nav.steps { margin: 6px 0 14px; }
nav.steps ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.step-btn {
font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
border-radius: 999px; padding: 3px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
min-height: 36px; min-width: 36px; justify-content: center; text-align: left;
}
.step-btn .n {
display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%;
background: var(--wait-bg); color: var(--ink); font-size: .8rem; font-weight: 700; flex: none;
}
.step-name, .step-group-name {
position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
clip-path: inset(50%); white-space: nowrap; border: 0;
}
.step-btn.step-last { padding-right: 12px; }
.step-last .step-name { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip-path: none; white-space: normal; }
nav.steps li, nav.steps .step-group { display: contents; }
.step-btn[aria-current="step"] { border-color: var(--heading); box-shadow: inset 0 0 0 1px var(--heading); font-weight: 700; }
.step-btn[aria-current="step"] .n { background: var(--btn-bg); color: var(--btn-ink); }
.step-controls { margin-top: 4px; }
.incomplete { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 4px; }
.incomplete ul { padding-left: 1.2em; }
.incomplete li { margin: 6px 0; }
.field { margin: 14px 0; }
.field > label, .field .lbl, .copybox > .lbl { display: block; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.hint { display: block; font-size: .92rem; color: var(--muted); margin: 0 0 4px; }
.field input[type="text"], .field textarea, .field select, textarea.output, .copybox textarea {
display: block; width: 100%; max-width: 100%; font: inherit; padding: 9px 10px;
border: 1px solid var(--field-line); border-radius: 6px; background: var(--surface); color: var(--ink);
}
.field textarea { min-height: 76px; resize: vertical; }
.field select { min-height: 44px; }
.field.nested { margin: 6px 0 0 30px; }
.field.is-inactive-hidden > :not(.field-inactive) { display: none !important; }
.field-inactive { margin: 4px 0 0; }
fieldset.group { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; margin: 0; min-width: 0; }
fieldset.group > legend { font-weight: 600; padding: 0 4px; }
fieldset.group.compact { border: 0; padding: 0; }
.opt {
display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; margin: 2px 0;
cursor: pointer; line-height: 1.4; min-height: 32px;
}
.opt:hover { background: var(--surface-2); }
.opt input { margin-top: 3px; width: 20px; height: 20px; flex: none; accent-color: var(--navy); }
.opt .sym { font-weight: 800; width: 1.2em; text-align: center; flex: none; }
.opt.nested { margin-left: 30px; }
.opt input:disabled + span { color: var(--muted); }
fieldset.marks { display: block; }
fieldset.marks .opt { display: inline-flex; margin-right: 10px; }
.tag {
display: inline-block; font-size: .8rem; font-weight: 600; color: var(--muted);
border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 1px;
}
.flag {
border-left: 5px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-ink);
border-radius: 6px; padding: 8px 12px; margin: 6px 0;
}
.flag p { margin: 0 0 4px; }
.flag .sym { font-weight: 800; }
.count { font-size: .93rem; color: var(--muted); margin: 4px 0 10px; }
.repeat { margin: 14px 0; }
fieldset.repeat-item { border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px 12px; margin: 0 0 12px; min-width: 0; }
fieldset.repeat-item > legend { font-weight: 700; color: var(--heading); padding: 0 4px; }
.confirm { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 12px; margin-top: 8px; }
.carry-copy { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--line); }
.carry-copy > h3 { margin: 8px 0 4px; color: var(--heading); font-size: 1.05rem; }
.replace-stored { margin-top: 8px; }
:where(#wb-main) :where(p, li, dd) { white-space: pre-line; }
.excerpt { border: 1px dashed var(--field-line); border-radius: 8px; padding: 10px 14px; margin: 12px 0; background: var(--surface-2); }
.excerpt-label { font-weight: 700; font-size: 1rem; margin: 0 0 2px; }
.excerpt-source { font-size: .9rem; color: var(--muted); margin: 0 0 6px; }
.excerpt-text { white-space: pre-wrap; margin: 0 0 6px; }
.excerpt-text.is-empty { color: var(--muted); font-style: italic; }
.replace-choice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 12px; margin-top: 6px; }
.wk details { margin: 12px 0; }
.wk details > summary { display: list-item; cursor: pointer; min-height: 44px; box-sizing: border-box; padding: 10px 0; font-weight: 600; color: var(--heading); }
.wk-example-text { white-space: pre-line; overflow-wrap: anywhere; margin: 4px 0 10px; }
.wk-excerpt-part { margin: 8px 0 0; }
.wk-sub { font-weight: 600; }
.wk-group { border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 10px; margin: 14px 0; background: var(--surface); }
.wk-group-heading { margin-top: 8px; }
.wk-counter { border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 8px; margin: 14px 0; background: var(--surface-2); }
.wk-counter-list { margin: 0 0 8px; padding-left: 1.2em; }
table.wk-plan { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
table.wk-plan th, table.wk-plan td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.wk-plan thead th { background: var(--surface-2); }
table.wk-plan th[scope="row"] { font-weight: 600; white-space: nowrap; }
table.wk-plan .wk-plan-mine .field { margin: 0; }
table.wk-plan .wk-plan-mine .field > label { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
table.wk-plan .wk-plan-mine input[type="text"] { min-height: 44px; }
table.wk-plan tr.wk-plan-break td { background: var(--warn-bg); color: var(--warn-ink); font-style: italic; }
.copybox { margin: 12px 0; }
.copybox textarea { min-height: 200px; white-space: pre-wrap; background: var(--surface-2); font-size: .95rem; line-height: 1.45; resize: vertical; }
.copy-status { font-size: .93rem; margin: 6px 0 0; min-height: 1.4em; }
.copy-status[data-state="ok"] { color: var(--ok-ink); font-weight: 600; }
.copy-status[data-state="error"] { color: var(--no-ink); font-weight: 600; }
.copy-status[data-state="ok"]::before { content: "\2713  "; }
.copy-status[data-state="error"]::before { content: "!  "; }
.submit { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 4px; }
.survey-where { font-weight: 600; }
.this-week-body { margin-bottom: 8px; }
ol.progress-strip { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
a.chip {
display: flex; flex-wrap: wrap; gap: 2px 14px; text-decoration: none; color: var(--ink);
border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); min-height: 44px;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-current] { border: 2px solid var(--heading); }
.chip-title { flex: 1 1 100%; font-weight: 700; color: var(--link); text-decoration: underline; }
.chip-dates, .chip-status { font-size: .92rem; color: var(--muted); }
.chip.started .chip-status:first-of-type { color: var(--ok-ink); }
.chip-now { font-size: .92rem; font-weight: 700; color: var(--heading); }
.empty { border-left: 6px solid var(--gold); }
.lede { font-size: 1.05rem; margin: 0 0 14px; }
details.progress > summary { cursor: pointer; list-style-position: outside; margin-left: 1.1em; }
details.progress > summary > h2 { display: inline; margin: 0; font-size: 1.15rem; }
.table-wrap { margin: 10px 0; }
table.restore-table { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.restore-table caption { text-align: left; font-weight: 600; margin-bottom: 4px; }
table.restore-table th, table.restore-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.restore-table thead th { background: var(--surface-2); }
table.restore-table .sym { font-weight: 800; display: inline-block; width: 1.2em; text-align: center; }
td[data-status="pasted-newer"], td[data-status="only-pasted"] { background: var(--ok-bg); color: var(--ok-ink); }
td[data-status="differ"] { background: var(--warn-bg); color: var(--warn-ink); }
.dates-line { display: block; font-size: .85rem; color: inherit; opacity: .9; }
.differ { border: 1px solid var(--warn-line); border-radius: 8px; padding: 8px 14px; margin: 12px 0; }
.side-by-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.side { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.side-label { font-weight: 700; margin: 0 0 4px; }
.side-text { white-space: pre-wrap; }
.restore-kind { font-weight: 600; }
.unknown-material ul, .warnings ul { padding-left: 1.2em; }
.restore-result { font-weight: 600; }
@media (max-width: 600px) {
.wb-main { padding: 12px 16px; }
.panel, section.step, .issue { padding: 12px; }
h1 { font-size: 1.35rem; }
.side-by-side { grid-template-columns: minmax(0, 1fr); }
table.restore-table, table.restore-table tbody, table.restore-table tr, table.restore-table th, table.restore-table td { display: block; width: 100%; }
table.restore-table caption { display: block; width: 100%; }
table.restore-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
table.restore-table tr { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
table.restore-table th, table.restore-table td { border: 0; border-bottom: 1px solid var(--line); }
.field.nested { margin-left: 12px; }
.opt.nested { margin-left: 12px; }
ol.progress-strip { grid-template-columns: minmax(0, 1fr); }
table.wk-plan, table.wk-plan tbody, table.wk-plan tr, table.wk-plan th, table.wk-plan td { display: block; width: 100%; box-sizing: border-box; }
table.wk-plan thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
table.wk-plan tr { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
table.wk-plan th, table.wk-plan td { border: 0; }
table.wk-plan th[scope="row"] { white-space: normal; }
table.wk-plan td.wk-plan-course::before { content: attr(data-label) ": "; font-weight: 600; }
table.wk-plan .wk-plan-mine .field > label { position: static; width: auto; height: auto; margin: 0 0 4px; overflow: visible; clip-path: none; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
.save-status, .flag, .chip, .step-btn, .side, .excerpt { border: 1px solid CanvasText; }
.step-btn[aria-current="step"] { outline: 3px solid Highlight; }
}
</style>
</head>
<body>
<a class="skip-link" id="wb-skip" href="#wb-main" data-skip="wb-main"></a>
<div id="wb-status" role="status" aria-live="polite" class="visually-hidden"></div>
<div id="wb-alert" role="alert" class="visually-hidden"></div>
<header class="wb-header" id="wb-header">
  <div class="wb-header-inner">
    <div class="wb-titles">
      <p class="wb-course" id="wb-course"></p>
      <p class="wb-view" id="wb-view-title"></p>
    </div>
    <nav class="wb-nav" id="wb-header-nav">
      <ul>
        <li><a href="#home" id="wb-nav-home"></a></li>
        <li><a href="#file" id="wb-nav-file"></a></li>
      </ul>
    </nav>
    <div class="wb-status-row">
      <p class="save-status" id="wb-save-status" data-state="busy"><span class="sym" aria-hidden="true"></span> <span class="txt"></span></p>
      <button type="button" class="btn small on-dark" id="wb-retry-btn" hidden></button>
      <button type="button" class="btn small on-dark" id="wb-recovery-btn" hidden></button>
      <p class="save-note" id="wb-notice" hidden></p>
    </div>
  </div>
</header>
<main class="wb-main" id="wb-main" tabindex="-1"></main>
<div class="wb-tools">
  <button type="button" class="btn small secondary" id="wb-copy-btn" aria-expanded="false" aria-controls="wb-copy-panel"></button>
  <button type="button" class="btn small secondary" id="wb-restore-btn"></button>
</div>

ek's steps are still empty. You can still copy your text and submit with empty boxes, and you'll get the same 5 points.","core.step.incomplete.none":"Every box this week's steps ask about has some writing in it. If you'll use this writing in a graded assignment, check that assignment's directions before you submit it in Canvas.","core.step.item":"Step {n} of {total}:","core.step.nav":"This week's steps","core.submit.copy.label":"Your workbook text","core.submit.docline":"Week {week} Workbook","core.submit.guide":"Open the course page that links to {item}","core.submit.heading":"For \"{item}\" in Canvas","core.submit.link":"Open \"{item}\"","core.submit.options":"Any submission gets the full 5 points: all of the text, part of it, a short summary in your own words, \"N/A,\" or a blank box.","core.submit.steps":"Saving here doesn't hand anything in. Click \"Copy\" under \"Your workbook text,\" then open \"{item},\" click \"Take the Survey\" at the bottom of the page, paste, and submit.","core.tag.optional":"Optional","core.week.none.body":"There are no new workbook steps for Week {n}. Check Canvas Modules for this week's assignments. You can open earlier weeks from \"Workbook home.\"","core.week.none.title":"Week {n}","kit.copy.backup":"For a spare copy, click \"Copy all workbook text\" at the bottom of the page and paste it into Workbook backup, in {link}Modules{/link} under Introduction to the Course.","kit.copy.closed":"{item} closed after Friday, May 21, at 11:59 PM Pacific, so it can no longer earn points. You can still read and copy everything here.","kit.copy.item.line":"Copy \"Your workbook text\" and paste it into {item} as it is. The lines in square brackets let the workbook bring your writing back later. It's due {due}, and any submission gets the full 5 points.","kit.copy.late":"{item} is past its due date, but any submission still gets the full 5 points through Friday, May 21.","kit.copy.memory":"Your writing isn't saving to Canvas right now. Before you leave, click \"Copy all workbook text\" at the bottom of the page and paste it into a document or into Workbook backup (in {link}Modules{/link} under Introduction to the Course). For the points, you still need to paste your workbook text into {item}.","kit.copy.stage.empty":"This box fills in as you write in the steps before this one.","kit.copy.stage.label":"Your text for {stage}","kit.copy.stage.line":"The second box holds your text for {stage}. Copy it, paste it there in Canvas by {stage_due}, and read it over before you submit.","kit.earlier.empty":"Nothing is saved here yet. If you wrote this outside the workbook, your submitted version is in Grades.","kit.earlier.summary":"Show what you wrote earlier","kit.example.summary":"Show an example","kit.fullprompt":"The full prompt and an example are on the {stage} page, in {link}Modules{/link}.","kit.plan.break":"Spring break is March 29 to April 4, and nothing is due.","kit.plan.col.course":"Course work due","kit.plan.col.mine":"What I'll do on my project","kit.plan.col.week":"Week","kit.plan.row.label":"Week {n}: what I'll do on my project","kit.plan.w04.course":"Check-in 1 with me","kit.plan.w04.week":"4 (Feb 15 to 21)","kit.plan.w05.course":"Research Review","kit.plan.w05.week":"5 (Feb 22 to 28)","kit.plan.w06.course":"Community Conversation","kit.plan.w06.week":"6 (Mar 1 to 7)","kit.plan.w07.course":"Break","kit.plan.w07.week":"7 (Mar 8 to 14)","kit.plan.w08.course":"Logistics and Policy","kit.plan.w08.week":"8 (Mar 15 to 21)","kit.plan.w09.course":"A working draft to your reviewer","kit.plan.w09.week":"9 (Mar 22 to 28)","kit.plan.w10.course":"Draft and Feedback","kit.plan.w10.week":"10 (Apr 5 to 11)","kit.plan.w11.course":"Check-in 2","kit.plan.w11.week":"11 (Apr 12 to 18)","kit.plan.w12.course":"Nothing","kit.plan.w12.week":"12 (Apr 19 to 25)","kit.plan.w13.course":"Finish the project and start the final note","kit.plan.w13.week":"13 (Apr 26 to May 2)","kit.plan.w14.course":"Final Capstone Submission","kit.plan.w14.week":"14 (May 3 to 9)","kit.start.late":"{item} was due {due}, so Canvas now shows it as missing with a 0 until you submit. You can still get all 5 points, with no late deduction, until Friday, May 21, 2027, at 11:59 PM Pacific.","kit.step.copy.title":"Copy text for Canvas","w02.area.heading":"Focus area {n}","w02.copy.after":"After you post, reply to one classmate by Tuesday, February 9.","w02.example.text":"What I care about: Video games. I play most days, and I've started building small ones.\n\nThe problem: The fourth graders at the after-school program my brother goes to avoid fractions practice. I've watched them rush through the worksheets or leave them blank, and a tutor there told my mother it's the hardest part of the afternoon.\n\nA first idea: A short game in which comparing fractions is how you win, for the tutors to use during homework time.","w02.f.area.knows.label":"One thing this field knows or does that could help","w02.f.area.name.hint":"As it appears on your IDS Pathway \u0026 Growth Plan (degree plan).","w02.f.area.name.label":"Name of the focus area","w02.f.care.hint":"The interest from your Getting Started post, or a new one.","w02.f.care.label":"What I care about","w02.f.closest.hint":"Module 1 Resources has five projects. Which of the two you looked at is closest to yours, and what problem were its makers working on?","w02.f.closest.label":"The closest of the five projects","w02.f.first.hint":"What you could make or propose, and who would use it.","w02.f.first.label":"A first idea","w02.f.problem.hint":"Who has it, where, and how you know it's a problem. Check that your sentence doesn't already contain your solution.","w02.f.problem.label":"The problem","w02.intro":"These boxes match the four headings of your post in Capstone Stage 1: Project Idea, which is due Thursday, February 4. A first version is enough, because you can change any part of it next week in the Charter.","w02.step.find.title":"Find your problem","w02.title":"Week 2: Find your problem","w03.copy.after":"If you haven't booked Check-in 1 yet, the Check-in 1 page in Modules has the booking link. Choose a time after you plan to submit the Charter.","w03.example.text":"4. Success measure: Before May 6, three fourth graders who haven't seen the game will each play the level once. It works if all three can finish it in ten minutes without my help, and if each one gets more of five comparison questions right after playing than before. On my Week 9 draft, which will be two screens, I'll check only whether they can get through both. The program's director has agreed to this, and she'll ask the children's parents.","w03.f.a1.hint":"The problem and who has it, what you'll make or propose, and who will use it. Use the question your classmate asked you in Project Idea.","w03.f.a1.label":"1. The project in three sentences","w03.f.ai.hint":"One sentence about whether you plan to use AI and how. \"I do not plan to use AI\" counts.","w03.f.ai.label":"7. AI use","w03.f.area.hint":"Name the focus area, a concept or method from one of its courses, the course, and how it will help with this project.","w03.f.area.label":"5. Focus area {n}","w03.f.ci1.hint":"Optional. Check-in 1 is a meeting with me by Friday, February 19.","w03.f.ci1.label":"Questions to bring to Check-in 1","w03.f.full.hint":"What would exist if everything went right, in two or three sentences.","w03.f.full.label":"2. The full version","w03.f.measure.hint":"One check you can run before May 6, who or what you'll check it with, and the result that would tell you the project works. Then say how you could run the check on your rougher Week 9 draft.","w03.f.measure.label":"4. Success measure","w03.f.message.hint":"The short message you'll send to the first person this week. Say who you are, why you're asking them, and how much time you need. If you don't hear back in four or five days, ask the next person on your list.","w03.f.message.label":"6. My first message","w03.f.people.hint":"Two or three people who have the problem, work on it, or make decisions about it. People you already know count if they have direct experience.","w03.f.people.label":"6. People to talk to","w03.f.risk.hint":"One thing that could get in the way, and a smaller version you could still finish if it does.","w03.f.risk.label":"7. What could go wrong","w03.f.semester.hint":"What you'll finish by May 6, the form it takes, and why that form suits the people it's for.","w03.f.semester.label":"2. The semester version","w03.intro":"These boxes are the seven answers of Capstone Stage 2: Charter, which is due Thursday, February 11.","w03.plan.heading":"3. Weekly plan","w03.plan.intro":"Write one line for each week about your own project. The course work is already decided. A break week can say \"Break.\"","w03.step.people.title":"Your focus areas and people","w03.step.plan.title":"Your plan and success measure","w03.step.project.title":"Your project","w03.title":"Week 3: Plan your weeks","w03.week2.heading":"Your Week 2 answers","w05.area.both":"Both","w05.area.named":"Focus area {n}: {name}","w05.area.neither":"Neither","w05.area.one":"My first focus area","w05.area.two":"My second focus area","w05.charter.heading":"Your Charter","w05.copy.after":"In Canvas, check that each source still has its five lines. You can also rebuild the grid as a table there.","w05.count.against":"Sources that argue against your claim or complicate it: {n} of at least 1","w05.count.areas":"Focus areas with at least one research article: {n} of 2","w05.count.articles":"Research articles from scholarly journals: {n} of 3","w05.count.heading":"What your grid has so far","w05.count.library":"Research articles that aren't free on the open web: {n} of 2","w05.count.note":"The workbook counts from the choices you make for each source, and one article can count toward more than one of these.","w05.count.total":"Sources: {n}. The assignment asks for five to seven.","w05.example.text":"Source: Van Hook and Altman (2012), \"Competitive Food Sales in Schools and Childhood Obesity: A Longitudinal Study,\" Sociology of Education\n\nThey say: Children's weight gain between fifth and eighth grade wasn't related to whether their middle school sold snacks and soft drinks.\n\nI say: My claim may be wrong. I can't promise that changing the store will change anyone's weight.\n\nFor, against, or mixed: Against","w05.export.area":"Focus area: {name}.","w05.export.area.both":"Both focus areas.","w05.f.against.hint":"If you don't have a good answer yet, say so.","w05.f.against.label":"The strongest argument against my project, and my answer to it","w05.f.agree.label":"What the sources agree on, and where they disagree","w05.f.area.hint":"An article counts for a focus area if it uses that field's ideas or methods, or comes from a journal in that field.","w05.f.area.label":"Focus area it comes from","w05.f.change.hint":"Quote the line from your Charter that changes, and give the new line. If nothing changes, explain why the research supports your plan as it is.","w05.f.change.label":"What I'm changing","w05.f.ci1notes.hint":"Optional. Anything from our conversation that you want to keep.","w05.f.ci1notes.label":"Check-in 1: my notes","w05.f.cite.hint":"Author, year, title, and where it was published.","w05.f.cite.label":"Source","w05.f.claim.hint":"One sentence that begins \"My project assumes that.\"","w05.f.claim.label":"The claim my project depends on","w05.f.found.hint":"For example, OneSearch, Google Scholar, or a newspaper's website.","w05.f.found.label":"Where I found it","w05.f.free.label":"Is it free on the open web?","w05.f.isay.hint":"What it means for your project.","w05.f.isay.label":"I say","w05.f.kind.label":"Kind of source","w05.f.question.hint":"Write the claim as a question. Then add a sentence on how your sources, your conversation, and your check will help you answer it.","w05.f.question.label":"The claim as a question, and how I'll answer it","w05.f.say.hint":"The main finding or argument, in a sentence or two of your own words.","w05.f.say.label":"They say","w05.f.stance.label":"For, against, or mixed","w05.free.no":"No, I read it through the library","w05.free.yes":"Yes, anyone can read it","w05.intro":"These boxes build Capstone Stage 3: Research Review, which is due Thursday, February 25. Finding Research for Your Project, in Module 2, explains how to search the library and how to tell whether an article is free on the open web.","w05.kind.article":"Research article from a scholarly journal","w05.kind.media":"Video or podcast","w05.kind.news":"News story","w05.kind.other":"Another kind","w05.kind.report":"Report or website","w05.source.heading":"Source {n}","w05.stance.against":"Argues against my claim","w05.stance.for":"Supports my claim","w05.stance.mixed":"Does some of each","w05.step.sources.title":"Your claim and your sources","w05.step.write.title":"What the sources tell you","w05.title":"Week 5: Build your source grid","w05.write.words":"Aim for about 300 words across these three boxes.","w06.before.consent":"At the start, tell the person this is for a class and that your instructor and classmates may read what they said. Ask whether to use their name or only their role, and ask before you record.","w06.before.end":"At the end, ask three questions: What should I have asked? Who else should I talk to? Would you be willing to look at my draft in late March?","w06.before.heading":"When you talk","w06.charter.heading":"Your Charter","w06.copy.after":"If nobody could talk and you used a published interview or recording instead, say which one under \"Who I talked to.\"","w06.example.text":"What they said: \"They can do the worksheet if I read it to them.\" The tutor told me several of the fourth graders avoid fractions because the word problems are hard to read, and the fractions themselves aren't what stops them. She also said the program has four tablets for about twenty children, and that they don't use anything that needs a login.\n\nWhat I'm changing: My Charter said \"the fourth graders avoid fractions practice.\" The new line is \"the fourth graders avoid fractions practice that they have to read.\" So the level will show each question as a picture with almost no text, and it will run without an account. My success measure stays the same.","w06.f.ask.hint":"Each person's role and the date you asked. Say who agreed, and when and how you'll talk.","w06.f.ask.label":"Who I've asked, and when","w06.f.best.label":"The question that taught me the most","w06.f.change.hint":"Quote the line that changes, from your Charter or from your Research Review if you changed it there, and give the new line. If nothing changes, explain what they said that supports the plan as it is.","w06.f.change.label":"What I'm changing","w06.f.questions.hint":"Four or five questions about what the person has seen and done, and one open question from your Research Review.","w06.f.questions.label":"My questions","w06.f.reviewer.hint":"Whether this person will look at your draft, or who else you'll ask.","w06.f.reviewer.label":"My reviewer","w06.f.said.hint":"Two or three things, quoted or in your own words, with a sentence on why each one matters to your project.","w06.f.said.label":"What they said","w06.f.surprise.label":"What surprised me","w06.f.who.hint":"Their role (and their name, if they agreed to be named), the date, how long you talked, and how.","w06.f.who.label":"Who I talked to","w06.intro":"This week you talk with someone who has direct experience of your problem, and you write it up in Capstone Stage 4: Community Conversation, which is due Thursday, March 4. The assignment page has every step, and it says what to do if nobody you've asked has agreed to talk.","w06.people.heading":"Your Charter answer 6","w06.step.after.title":"After the conversation","w06.step.before.title":"Before the conversation","w06.title":"Week 6: Conversation notes","w08.contact.heading":"What the person you talked with told you","w08.example.text":"Cost: The store sells about 120 items a day. If the new snacks cost the store 15 cents more each and prices stay the same, the store earns 120 × $0.15 = $18 less a day, or about $3,240 less over a 180-day school year. The 120 comes from the store's adviser, and the 15 cents is my guess from grocery store prices. The store's profit pays for the eighth-grade trip, so the student council would have to agree to earn less or raise prices.","w08.f.affected.hint":"Who benefits, who gives up time or money, and who could be left out? Consider at least one of these: the history of the problem, cultural differences among the people involved, effects beyond your own community, effects on the environment, or fairness.","w08.f.affected.label":"Who is affected","w08.f.cost.hint":"What the first year would cost, and who would pay. Show one estimate with your arithmetic, and say which of its numbers are guesses.","w08.f.cost.label":"Cost","w08.f.decides.hint":"Who would have to approve the project, and who could stop it?","w08.f.decides.label":"Who decides","w08.f.docs.hint":"At least two, such as a law, a policy, a budget, a price list, or the minutes of a public meeting.","w08.f.docs.label":"The documents I used","w08.f.planchange.hint":"If nothing changes, say what you found that supports the plan as it is.","w08.f.planchange.label":"What changes in my semester version","w08.f.planmeasure.label":"My success measure, revised or confirmed","w08.f.rules.hint":"Which laws, policies, codes, or licenses apply? Name at least one actual rule.","w08.f.rules.label":"Rules","w08.f.work.hint":"Who would run it and keep it going, and do they have the time?","w08.f.work.label":"Who does the work","w08.five.each":"For each question, say what you found, where you found it, and what you still don't know.","w08.full.heading":"Your full version, from Charter answer 2","w08.intro":"These boxes build Capstone Stage 5: Logistics and Policy, which is due Thursday, March 18. Answer for the full version of your project, as if it were really carried out. Module 2 Resources lists where to look for rules, budgets, and meeting minutes.","w08.plan.intro":"These boxes start with what you wrote in your Charter. Change any line that your research, your conversation, or the five questions changed.","w08.step.five.title":"Five questions","w08.step.plan.title":"My updated plan","w08.title":"Week 8: Map the logistics","w09.copy.none":"No stage is due this week, so your workbook text is the only text to copy.","w09.f.check.hint":"Who you've booked and when. You can run the check any time from this week on, including over the break. If your draft is a script, a storyboard, or a paper version, say how you'll run the check on that.","w09.f.check.label":"How I'll run my check","w09.f.missing.hint":"What you'll finish after the break.","w09.f.missing.label":"What's still missing","w09.f.parts.hint":"What the draft will include when you send it.","w09.f.parts.label":"Parts of my draft","w09.f.reviewer.label":"My reviewer and when I'll send the draft","w09.intro":"This week you make a working draft and send it to your reviewer by Thursday, March 25, before spring break. Module 3 Resources says how much a working draft needs in each form.","w09.measure.heading":"Your success measure","w09.reviewer.heading":"The reviewer you named in Week 6","w09.step.draft.title":"Plan your working draft","w09.title":"Week 9: Make a working draft","w10.copy.after":"Attach or link your draft in the post, with captions or a transcript for audio or video. Open your own link in a private browser window before you post. Then reply to one classmate by Tuesday, April 13.","w10.example.text":"My check: My success measure was that three fourth graders could finish the level in ten minutes without help and get more comparison questions right afterward. Two finished in under ten minutes. The third stopped at the second screen because she didn't know the bar could be dragged. Three children can't show that the level works for every fourth grader, but they showed me where one of them got stuck.\n\nDecisions: I'm adding an arrow on the second screen that shows the bar can be dragged, because one of three children got stuck there. The tutor suggested a score at the end, and I'm leaving that out for now, since a score isn't needed to tell whether the level teaches comparing.","w10.f.check.hint":"Your success measure, what you did, what happened, and what that result can and can't show.","w10.f.check.label":"My check","w10.f.decisions.hint":"At least two decisions, each with a reason. A decision can be to change something or to keep it. If an AI tool reviewed your draft, check one of its suggestions against a source from your Research Review or against what your contact told you, and say what you found.","w10.f.decisions.label":"Decisions","w10.f.feedback.hint":"Who reviewed the draft (their role, or the name of the AI tool) and two specific comments they made.","w10.f.feedback.label":"Feedback","w10.f.project.hint":"The problem, who the project is for, and what the draft is.","w10.f.project.label":"My project","w10.intro":"These boxes are the four headings of your post in Capstone Stage 6: Draft and Feedback, which is due Thursday, April 8. Aim for about 300 words in all.","w10.measure.heading":"Your success measure and your plan for the check","w10.step.sort.title":"Your check and your feedback","w10.title":"Week 10: Sort your feedback","w13.check.captions":"Audio and video have captions or a transcript, and important pictures have descriptions.","w13.check.opens":"My file or link opens in a private browser window.","w13.check.sources":"My sources are listed in the project or in the final note.","w13.check.tried":"I tried the whole project from start to finish.","w13.copy.after":"Post this text with your project in Final Capstone Submission by Thursday, May 6. You don't have to reply to anyone there.","w13.example.line":"A Project Taking Shape, in Introduction to the Course, has a complete final note.","w13.f.ai.hint":"One to three sentences about what you used AI for and what you checked or changed. If you didn't use AI, write \"I did not use AI.\"","w13.f.ai.label":"AI use","w13.f.checks.legend":"Final checks","w13.f.intro.hint":"About 100 words that say what the problem is, who the project is for, and what to look at first.","w13.f.intro.label":"Introduction for your classmates","w13.f.s1.hint":"Who has the problem and how you know, what you made, and how this semester version differs from the full version.","w13.f.s1.label":"1. The problem and the project","w13.f.s2.hint":"One choice in the project that you made with a concept or method from each of your two focus areas, and how you used the two together.","w13.f.s2.label":"2. Choices from both focus areas","w13.f.s3.hint":"What the research supports in your project, what the strongest argument against it was, and how the finished project answers that argument or allows for it. Say where in the project people can find your sources.","w13.f.s3.label":"3. Research","w13.f.s4.hint":"What the conversation and your reviewer changed in the project, and what your success measure showed. Give the result plainly, even if it was mixed.","w13.f.s4.label":"4. People","w13.f.s5.hint":"Name the one rule, cost, or decision that matters most to carrying out the full version. Then develop two of the five Questions about effects in Module 3 Resources (historical, multicultural, global, ecological, and equity). End with one fairer choice you made, what it gains, and what it costs or leaves unresolved.","w13.f.s5.label":"5. What it would take, and who is affected","w13.intro":"This week you finish the project and start the final note. Both go into Final Capstone Submission, which is due Thursday, May 6, in Week 14. Each section asks you to reread an earlier stage, so the workbook shows what you wrote. Aim for 400 to 600 words across the five sections.","w13.step.first.title":"Introduction and sections 1 to 3","w13.step.last.title":"Sections 4 and 5, AI use, and final checks","w13.title":"Week 13: Finish your capstone","w15.back.charter":"Charter (Week 3)","w15.back.conversation":"Community Conversation (Week 6)","w15.back.empty.all":"None of your writing from earlier weeks is saved in the workbook. Your submitted work is in Grades.","w15.back.feedback":"Draft and Feedback (Weeks 9 and 10)","w15.back.final":"Final note (Week 13)","w15.back.idea":"Project Idea (Week 2)","w15.back.intro":"Written Reflection: Then and Now is due Thursday, May 13, and it asks you to reread your earlier work, so here it is in one place. Your Getting Started post is in its discussion in Canvas, and your submitted work and my comments are in Grades.","w15.back.logistics":"Logistics and Policy (Week 8)","w15.back.open":"Open any part to see what you wrote.","w15.back.research":"Research Review (Week 5)","w15.copy.item.line":"Copy \"Your workbook text\" and paste it into {item} as it is. It's due {due}, and any submission gets the full 5 points. Your notes aren't the reflection itself, which you'll write and hand in in Written Reflection: Then and Now.","w15.copy.notes.label":"Notes for Written Reflection","w15.copy.notes.line":"You can also copy only these notes into a document and write Written Reflection from them.","w15.copy.prep":"In {link}Final Conversation notes{/link}, you can write reminders for your Final Conversation, May 17 to 21. They're only for you, and your workbook text leaves them out.","w15.event.heading":"Event or decision {n}","w15.example.text":"What happened: Before anyone played the level, I expected the hard part to be the fractions. Then three fourth graders tried it, and one stopped at the second screen because she didn't know the bar could be dragged.\n\nConcept or method: Testing a small version with users before adding features, from my programming course.\n\nWhat I learned: A learning tool can fail before the learning even starts. I still don't know whether the level works for children who find reading hard, since all three testers read well.","w15.f.article.hint":"The article is in Module 4 Resources. Name one specific claim, and say whether your project supports it, complicates it, or can't speak to it.","w15.f.article.label":"A claim in Bear and Skorton's article","w15.f.compare.label":"What each focus area helped me see, and what it couldn't show","w15.f.concept.hint":"Use one focus area for the first event and your other focus area for the second.","w15.f.concept.label":"The concept or method that helps explain it","w15.f.learned.label":"What I learned, and what I'm still unsure about","w15.f.then.hint":"What you expected your studies or project to help you do, including one idea, skill, or belief you started with.","w15.f.then.label":"Then: what I expected at the start","w15.f.what.hint":"For example, the argument against your project, the surprise in your conversation, or the result of your check.","w15.f.what.label":"What happened, or what I decided","w15.notes.intro":"These notes are only a start, and a few words in each box is enough. You'll write the reflection itself in Written Reflection: Then and Now, which has the full prompts and examples.","w15.prep.before":"Submit Written Reflection before your meeting or recording, and have your project and your reflection open during the conversation.","w15.prep.discuss.heading":"Discuss choices: about ten minutes","w15.prep.discuss.intro":"Prepare all five topics. Under each one is what you wrote in the workbook.","w15.prep.early":"Final Conversation notes are available from now through finals week. The excerpts fill in as you write in the workbook, so some may still be empty.","w15.prep.f.discuss.label":"Reminders for the discussion","w15.prep.f.finish.label":"Reminders for the finish","w15.prep.f.group.hint":"People other than the ones your project is for, who could use it or be affected by it.","w15.prep.f.group.label":"My second group","w15.prep.f.present.hint":"The problem, what you made, one thing you found out and the evidence behind it, and why it matters to the second group.","w15.prep.f.present.label":"Reminders for my presentation","w15.prep.finish.heading":"Finish: what your studies help you do","w15.prep.finish.intro":"You'll spend about three minutes on what your two focus areas together help you do. Four sentences make a good start: name your two focus areas, a task or problem you can work on by combining them, an example from your project, and a limit or a realistic next step.","w15.prep.intro":"These notes help you prepare for Final Conversation, which is worth 20 points and takes place during finals week, May 17 to 21, 2027. Nothing here is graded or submitted.","w15.prep.older":"The excerpts below come from the workbook, so they may be older than what you submitted. If one differs from your submitted work, use the submitted version, which is in Grades.","w15.prep.ownwords":"Speak in your own words. AI can help you make short reminders, as long as you check them and understand them, but don't read out answers that AI wrote.","w15.prep.start.heading":"Start: a two-minute presentation","w15.prep.t.areas":"Both focus areas","w15.prep.t.form":"Form","w15.prep.t.people":"People","w15.prep.t.source":"A source","w15.prep.t.unknown":"What remains unknown","w15.prep.title":"Final Conversation notes","w15.step.back.title":"Look back at your work","w15.step.notes.title":"Your notes for Written Reflection","w15.title":"Week 15: Prepare to reflect"}</script>

WB.build = Object.freeze({"DEFAULT_MODE": "auto", "OWN_TAB_URL": "https://romanf88-arch.github.io/ids400-workbook/dev/?mode=browser", "RELEASE": true, "SHELL_ORIGIN_PATTERNS": ["^https://[a-z0-9-]+\\.scorm\\.canvaslms\\.com$"], "TEST": false, "VERSION": "4fe54edbfa6b"});
WB.APP_VERSION = WB.build.VERSION;
WB.config = Object.assign({}, WB.config, { shellOriginPatterns: ["^https://[a-z0-9-]+\\.scorm\\.canvaslms\\.com$"] });
/* core/bridge.js */
(function(){
'use strict';
var root=typeof window!=='undefined'?window:globalThis;
var WB=root.WB=root.WB||{};
var PROTOCOL=1;
var TYPES=Object.freeze({
hello:1,load:1,save:1,stage:1,suspend:1,ready:1,loaded:1,saved:1,failed:1,notice:1
});
var DIRECTIONS=Object.freeze({
toShell:Object.freeze(['hello','load','save','stage','suspend']),
toWorkbook:Object.freeze(['ready','loaded','saved','failed','notice'])
});
var CAPS=Object.freeze(['stage','replace','notice']);
var LIMITS=Object.freeze({maxBytes:60000,warnBytes:48000,maxDocChars:1000000,maxText:1000,maxId:64,maxCaps:16});
var REASONS=Object.freeze(['too_large','commit_error','not_initialized','refused']);
var NOTICES=Object.freeze(['other_open','superseded','clear']);
var FORMATS=Object.freeze({deflate:'D',plain:'P'});
var ID_RE=/^[A-Za-z0-9_.:-]+$/;
var CANVAS_BASE_RE=/^(https:\/\/[A-Za-z0-9.-]{1,190}(:\d{1,5})?|http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?)$/;
var COURSE_RE=/^\d{1,12}$/;
function isPlainObject(x){
if(x===null||typeof x!=='object'||Array.isArray(x))return false;
if(Object.prototype.toString.call(x)!=='[object Object]')return false;
var proto=Object.getPrototypeOf(x);
return proto===null||Object.getPrototypeOf(proto)===null;
}
function isRev(x){return typeof x==='number'&&Number.isSafeInteger(x)&&x>=0;}
function isCount(x){return typeof x==='number'&&Number.isSafeInteger(x)&&x>=0;}
function isShortText(x){return typeof x==='string'&&x.length<=LIMITS.maxText;}
function isDoc(x){return typeof x==='string'&&x.length<=LIMITS.maxDocChars;}
function isId(x){return typeof x==='string'&&x.length>=1&&x.length<=LIMITS.maxId&&ID_RE.test(x);}
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)&&o[k]!==undefined;}
function isCanvas(c){
return isPlainObject(c)&&typeof c.base==='string'&&CANVAS_BASE_RE.test(c.base)&&
typeof c.course==='string'&&COURSE_RE.test(c.course);
}
function bad(error){return{ok:false,error:error};}
function validate(msg,direction){
var allowed=DIRECTIONS[direction];
if(!allowed||!Object.prototype.hasOwnProperty.call(DIRECTIONS,direction))return bad('bad_direction');
if(!isPlainObject(msg))return bad('not_object');
if(msg.v!==PROTOCOL)return bad('bad_version');
if(typeof msg.type!=='string'||allowed.indexOf(msg.type)<0)return bad('bad_type');
if(!isId(msg.id))return bad('bad_id');
if(direction==='toShell'&&msg.type!=='hello'&&has(msg,'inst')&&!isId(msg.inst))return bad('bad_inst');
switch(msg.type){
case'hello':
if(!(typeof msg.appVersion==='string'&&msg.appVersion.length<=LIMITS.maxId))return bad('bad_appVersion');
break;
case'load':
case'suspend':
break;
case'save':
case'stage':
if(msg.type==='save'&&has(msg,'replace')&&typeof msg.replace!=='boolean')return bad('bad_replace');
if(!isRev(msg.rev))return bad('bad_rev');
if(!isDoc(msg.doc))return bad('bad_doc');
break;

const rules=item.rules||[];
for(let i=0;i<rules.length&&!verdict;i++){
const r=rules[i];
if(r.check===c.id&&matches(r.when,answer))verdict={pass:!!r.pass,reasonKey:r.reasonKey||c.passKey};
}
if(!verdict){
let passReason=null;
const dims=item.dimensions||[];
for(let i=0;i<dims.length&&!verdict;i++){
const o=optOf(dims[i],answer[dims[i].id]);

if(!m)continue;
if(m.pass===false)verdict={pass:false,reasonKey:m.reasonKey};

}
if(!verdict)verdict={pass:true,reasonKey:passReason||c.passKey};

c.key(item.changedKey,'changedKey');
c.key(item.changedMarkKey,'changedMarkKey');
const dimsOk=c.objs(item.dimensions,'dimensions',true);
const checksOk=c.objs(item.checks,'checks',true);
const start=p.length;
if(checksOk){
const seen=Object.create(null);
item.checks.forEach(function(ch,i){
c.uniqueId(ch.id,'check '+(i+1)+' id',seen);
c.key(ch.nameKey,'check "'+ch.id+'" nameKey',true);
c.key(ch.passKey,'check "'+ch.id+'" passKey',true);
});
}
if(dimsOk){
const seen=Object.create(null);
item.dimensions.forEach(function(d,i){
c.uniqueId(d.id,'dimension '+(i+1)+' id',seen);
c.key(d.legendKey,'dimension "'+d.id+'" legendKey',true);
c.key(d.hintKey,'dimension "'+d.id+'" hintKey');
if(!c.objs(d.options,'dimension "'+d.id+'" options',true))return;
const opts=Object.create(null);
d.options.forEach(function(o,j){
const where='dimension "'+d.id+'" option '+(j+1);
c.uniqueId(o.id,where+' id',opts);
c.key(o.labelKey,'option "'+o.id+'" labelKey',true);
if(!c.obj(o.marks,'option "'+o.id+'" marks')||!o.marks)return;
Object.keys(o.marks).forEach(function(cid){
const m=o.marks[cid];
if(!c.obj(m,'option "'+o.id+'" mark "'+cid+'"',true))return;
c.bool(m.pass,'option "'+o.id+'" mark "'+cid+'" pass');
c.key(m.reasonKey,'option "'+o.id+'" mark "'+cid+'" reasonKey',m.pass===false);

const dimIds=Object.create(null);

(item.rules||[]).forEach(function(r,i){if(!checkIds[r.check])p.push('rule '+(i+1)+' names unknown check');checkWhen(r.when,'rule '+(i+1));});

function sameSet(a,b){return P.util.sameSet(a,b);}
function findSet(list,chosen){return(list||[]).find(function(x){return sameSet(x.categories,chosen);})||null;}
function catLabelKey(item,id){const c=(item.categories||[]).find(function(x){return x.id===id;});return c?c.labelKey:null;}
function ordered(item,ids){
const order=(item.categories||[]).map(function(c){return c.id;});
return(ids||[]).slice().sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
}
function judgeEntry(entry,chosen){
const a=findSet(entry.accept,chosen);
if(a)return{state:'pass',reasonKey:a.reasonKey};
const p=findSet(entry.partly,chosen);
if(p)return{state:'partly',reasonKey:p.reasonKey};
const m=findSet(entry.misses,chosen);
if(m)return{state:'fail',reasonKey:m.reasonKey};
return{state:'fail',reasonKey:entry.missKey||'core.practice.classify.notYet'};
}
function score(item,answer){
answer=answer||{};
let all=true,any=false;
const lines=(item.entries||[]).map(function(e){
const chosen=ordered(item,answer[e.id]||[]);
const v=judgeEntry(e,chosen);
if(v.state!=='pass')all=false;
if(v.state!=='fail')any=true;
return{state:v.state,labelKey:e.textKey,valueKeys:chosen.map(function(id){return catLabelKey(item,id);}).filter(Boolean),reasonKey:v.reasonKey};
});
return{correct:all&&lines.length>0,partly:!all&&any,lines:lines};
}
function validate(item,answer){
answer=answer||{};
const missing=(item.entries||[]).filter(function(e){return!(answer[e.id]&&answer[e.id].length);});
if(missing.length)return{key:'core.practice.incomplete',vars:{count:missing.length},target:missing[0].id};
return null;
}
function renderItem(box,item,api){
const t=api.t,el=api.util.el;
const chosen={};
const firstInput={};
(item.entries||[]).forEach(function(entry){
chosen[entry.id]=[];
const fs=el('fieldset',{class:'wbp-entry','data-entry':entry.id});
fs.append(el('legend',{text:t(entry.textKey)}));
fs.append(el('p',{class:'wbp-hint',text:t(entry.multi?'core.practice.classify.multiHint':'core.practice.classify.singleHint')}));
const name=api.uid('entry-'+entry.id);
(item.categories||[]).forEach(function(c){
const id=api.uid('cat');
const inp=el('input',{type:entry.multi?'checkbox':'radio',name:name,id:id,value:c.id,'data-category':c.id});
if(!Object.prototype.hasOwnProperty.call(firstInput,entry.id))firstInput[entry.id]=inp;
let hint=null;
if(c.hintKey){hint=el('span',{class:'wbp-hint',id:api.uid('ch'),text:' '+t(c.hintKey)});inp.setAttribute('aria-describedby',hint.id);}
inp.addEventListener('change',function(){
if(entry.multi){
const set=chosen[entry.id].filter(function(x){return x!==c.id;});
if(inp.checked)set.push(c.id);
chosen[entry.id]=set;
}else if(inp.checked){
chosen[entry.id]=[c.id];
}
api.changed();
});
fs.append(el('label',{class:'wbp-opt',for:id},inp,el('span',null,el('span',{text:t(c.labelKey)}),hint)));
});
box.append(fs);
});
const btn=el('button',{type:'button',class:'wbp-btn','data-action':'check','aria-describedby':api.errorId,text:t('core.practice.check')});
btn.addEventListener('click',function(){
const a={};
Object.keys(chosen).forEach(function(k){a[k]=ordered(item,chosen[k]);});
api.submit(a);
});
box.append(el('div',{class:'wbp-row'},btn));
return{
focusInvalid:function(v){
const inp=Object.prototype.hasOwnProperty.call(firstInput,v.target)?firstInput[v.target]:null;
if(inp)inp.focus();
}
};
}
function setText(item,ids,t){
const labels=(ids||[]).map(function(id){return t(catLabelKey(item,id));});
return labels.length?labels.join(', '):t('core.practice.none');
}
function describe(item,answer,t){
return(item.entries||[]).map(function(e){return t(e.textKey)+': '+setText(item,(answer||{})[e.id],t);}).join('; ');
}
function changes(item,first,final,t){
return(item.entries||[]).filter(function(e){return!sameSet((first||{})[e.id],(final||{})[e.id]);}).map(function(e){
return t('core.practice.changedFromTo',{name:t(e.textKey),from:setText(item,first[e.id],t),to:setText(item,final[e.id],t)});
});
}
function check(item){
const p=[];
const c=P.schema.checker(p);
const catsOk=c.objs(item.categories,'categories',true);
const entriesOk=c.objs(item.entries,'entries',true);
const start=p.length;
const cats=Object.create(null);
if(catsOk){
item.categories.forEach(function(cat,i){
c.uniqueId(cat.id,'category '+(i+1)+' id',cats);
c.key(cat.labelKey,'category "'+cat.id+'" labelKey',true);
c.key(cat.hintKey,'category "'+cat.id+'" hintKey');
});
}
if(entriesOk){
const ids=Object.create(null);
item.entries.forEach(function(e,i){
c.uniqueId(e.id,'entry '+(i+1)+' id',ids);
c.key(e.textKey,'entry "'+e.id+'" textKey',true);
c.bool(e.multi,'entry "'+e.id+'" multi');
c.key(e.missKey,'entry "'+e.id+'" missKey');
['accept','partly','misses'].forEach(function(k){
if(!c.objs(e[k],'entry "'+e.id+'" '+k,k==='accept'))return;
(e[k]||[]).forEach(function(s,j){
const where='entry "'+e.id+'" '+k+' set '+(j+1);
c.ids(s.categories,where+' categories',true);
c.key(s.reasonKey,where+' reasonKey',true);
});
});
});
}
if(!catsOk||!entriesOk||p.length>start)return p;
if(item.categories.length<2)p.push('needs at least two categories');
if(!item.entries.length)p.push('entries is empty');
item.entries.forEach(function(e){
if(!e.accept.length)p.push('entry "'+e.id+'" has no accepted set');
['accept','partly','misses'].forEach(function(k){
(e[k]||[]).forEach(function(s){
if(!s.categories.length)p.push('entry "'+e.id+'" '+k+' set is empty');
s.categories.forEach(function(cid){if(!cats[cid])p.push('entry "'+e.id+'" names unknown category "'+cid+'"');});
if(!e.multi&&s.categories.length>1)p.push('entry "'+e.id+'" is single choice but lists a set of '+s.categories.length);
});
});
});
return p;
}
P.engines.classify={renderItem:renderItem,score:score,validate:validate,describe:describe,changes:changes,check:check};
})();

(function(){
'use strict';
const WB=(window.WB=window.WB||{});
const P=(WB.practice=WB.practice||{});
P.engines=P.engines||{};
const STATE={accept:'pass',partly:'partly',reject:'fail'};
function opt(item,id){return(item.options||[]).find(function(o){return o.id===id;})||null;}
function chosenIds(item,answer){
answer=answer||{};
if(item.multiple)return Array.isArray(answer.choices)?answer.choices.slice():[];
return answer.choice?[answer.choice]:[];
}
function score(item,answer){
const picked=chosenIds(item,answer).map(function(id){return opt(item,id);}).filter(Boolean);
const lines=picked.map(function(o){return{state:STATE[o.status]||'info',labelKey:o.labelKey,reasonKey:o.reasonKey};});
const accepts=picked.filter(function(o){return o.status==='accept';});
const rejects=picked.filter(function(o){return o.status==='reject';});
const correct=accepts.length>0&&rejects.length===0&&(item.multiple||picked.length===1);
return{correct:correct,partly:!correct&&picked.some(function(o){return o.status!=='reject';}),lines:lines};
}
function validate(item,answer){
const ids=chosenIds(item,answer);

const reasons=(answer&&answer.reasons)||{};
for(let i=0;i<ids.length;i++){
const o=opt(item,ids[i]);
if(o&&o.requiresReason&&!String(reasons[o.id]||'').trim())return{key:'core.practice.judge.needReason',target:o.id};

(function(){
'use strict';
const WB=(window.WB=window.WB||{});
const P=(WB.practice=WB.practice||{});
P.engines=P.engines||{};
function entry(item,id){return(item.entries||[]).find(function(e){return e.id===id;})||null;}
function startOrder(item){
if(Array.isArray(item.start)&&item.start.length)return item.start.slice();
return(item.entries||[]).map(function(e){return e.id;});
}
function eq(a,b){return a.length===b.length&&a.every(function(x,i){return x===b[i];});}
function ruleEntry(r){return r.entry!=null?r.entry:r.a;}
function broken(item,order){
return(item.rules||[]).filter(function(r){
if(r.type==='before'){
const ia=order.indexOf(r.a),ib=order.indexOf(r.b);
return!(ia>=0&&ib>=0&&ia<ib);
}
if(r.type==='first')return order[0]!==ruleEntry(r);
if(r.type==='last')return order[order.length-1]!==ruleEntry(r);
return false;
});
}
function permutations(ids){
const out=[];
(function walk(rest,acc){
if(!rest.length){out.push(acc.slice());return;}
for(let i=0;i<rest.length;i++){
acc.push(rest[i]);
walk(rest.slice(0,i).concat(rest.slice(i+1)),acc);
acc.pop();
}
})(ids.slice(),[]);
return out;
}
function acceptedOrders(item){
if(Array.isArray(item.accepted)&&item.accepted.length)return item.accepted.map(function(a){return(a.order||[]).slice();});
if(!(item.rules||[]).length)return[];
const ids=(item.entries||[]).map(function(e){return e.id;});
return ids.length<=8?permutations(ids).filter(function(o){return!broken(item,o).length;}):[];
}
function itemFacts(item,data){
const pool=data&&data.scenario&&Array.isArray(data.scenario.facts)?data.scenario.facts:null;
if(Array.isArray(item.facts)){
if(!pool)return[];
return pool.filter(function(f){return f&&item.facts.indexOf(f.id)!==-1;}).map(function(f){return{id:f.id,textKey:f.textKey};});
}
return(Array.isArray(item.factsKeys)?item.factsKeys:[]).map(function(k,i){return{id:i+1,textKey:k};});
}
function factNumbers(r,item,data){
const list=itemFacts(item,data);
return(r.facts||[]).map(function(f){
if(typeof f==='number')return f;

if(!c.obj(item.population,'population',true))return p;

c.key(pop.labelKey,'population labelKey');
if(c.obj(pop.measure,'population.measure',true)){

if(pop.measure.labelKey===undefined||pop.measure.labelKey===null||pop.measure.labelKey==='')p.push('population.measure.labelKey is missing');

c.num(pop.measure.decimals,'population.measure.decimals');

const ids=Object.create(null);
if(c.objs(pop.groups,'population.groups',true)){

if(!groups.length)p.push('population.groups is empty');
const mean=kindOf(item)==='mean';
groups.forEach(function(g,i){

c.key(g.labelKey,'group "'+g.id+'" labelKey',true);
if(c.num(g.count,'group "'+g.id+'" count',true)&&!(g.count>0))p.push('group "'+g.id+'" count must be above zero');

const valuesOk=c.nums(g.values,'group "'+g.id+'" values');
const rangeOk=c.num(g.min,'group "'+g.id+'" min')&&c.num(g.max,'group "'+g.id+'" max');
if(!mean&&yesOk&&!(typeof g.yes==='number'&&g.yes>=0&&g.yes<=g.count))p.push('group "'+g.id+'" yes must be between 0 and count');
if(mean&&valuesOk&&rangeOk&&!(Array.isArray(g.values)&&g.values.length)&&!(typeof g.min==='number'&&typeof g.max==='number'&&g.max>=g.min))p.push('group "'+g.id+'" needs values or min and max');
});
}
if(c.obj(item.biased,'biased')&&item.biased){
if(c.id(item.biased.group,'biased.group',true)&&!ids[item.biased.group])p.push('biased.group names an unknown group');
if(item.biased.labelKey===undefined||item.biased.labelKey===null||item.biased.labelKey==='')p.push('biased.labelKey is missing');
else c.key(item.biased.labelKey,'biased.labelKey');
c.key(item.biased.descriptionKey,'biased.descriptionKey');
}
if(c.obj(item.question,'question')&&item.question){
c.key(item.question.legendKey,'question legendKey',true);
if(c.objs(item.question.choices,'question choices',true)){
const cs=item.question.choices;
const seen=Object.create(null);
cs.forEach(function(ch,i){
c.uniqueId(ch.id,'question choice '+(i+1)+' id',seen);
c.key(ch.labelKey,'choice "'+ch.id+'" labelKey',true);
c.oneOf(ch.status,'choice "'+ch.id+'" status',['accept','partly','reject'],true);
c.key(ch.reasonKey,'choice "'+ch.id+'" reasonKey',true);
});
if(cs.length<2)p.push('question needs at least two choices');
if(!cs.some(function(ch){return ch.status==='accept';}))p.push('question has no accepted choice');
}
}
return p;
}

var parsed;
try{parsed=WB.format.parse(doc);}catch(e){return{ok:false,error:'parse'};}
if(!parsed||parsed.kind==='unknown')return{ok:false,error:'unknown',parsed:parsed};
var st=null;
try{
if(WB.state&&typeof WB.state.fromParsed==='function')st=WB.state.fromParsed(parsed);
}catch(e){st=null;}
if(!st){
var base=WB.state.createState();
var rows=[];
try{rows=WB.restore.compare(base,parsed)||[];}catch(e){rows=[];}
var choices={};
rows.forEach(function(r){choices[rowKey(r)]='pasted';});
try{st=WB.restore.apply(base,parsed,choices);}catch(e){return{ok:false,error:'apply',parsed:parsed};}
}
if(!st)return{ok:false,error:'apply',parsed:parsed};
if(parsed.header&&st.header){
if(st.header.openAt==null&&parsed.header.openAt!=null)st.header.openAt=parsed.header.openAt;
if(st.header.saved==null&&parsed.header.saved!=null)st.header.saved=parsed.header.saved;
}
if(parsed.practice&&typeof parsed.practice==='object'&&WB.state.mergePractice){
if(!st.practice)st.practice={};
WB.state.mergePractice(st.practice,parsed.practice);
}
return{ok:true,state:st,parsed:parsed};
}

if(!name)return practiceCache;
return practiceCache[name]||practiceCache[String(name).replace(/\.json$/,'')]||null;
}

function routeForField(fieldId){
var id=String(fieldId||'');
var tpl=id.replace(/\[\d+\]/,'[]');
var mods=weekModules();
for(var i=0;i<mods.length;i++){
var steps=Array.isArray(mods[i].steps)?mods[i].steps:[];
for(var j=0;j<steps.length;j++){
var f=steps[j].fields;
if(Array.isArray(f)&&(f.indexOf(id)>=0||f.indexOf(tpl)>=0))return mods[i].route+'/'+(steps[j].id||String(j));
}
}
var def=WB.registry.fieldById(id);
var owner=def&&def.owner?def.owner:null;
var om=owner?mods.filter(function(m){return moduleId(m)===owner;})[0]:null;
if(om){
var st=Array.isArray(om.steps)?om.steps:[];
return st.length?om.route+'/'+(st[st.length-1].id||String(st.length-1)):om.route;
}
return null;
}

function timeText(d){

function statusView(){
var m=mode();
var s=app.status||{};
if(app.phase==='loading'||app.connecting)return{id:'core.status.loading',kind:'busy',sym:'…'};
if(!m||m==='memory'){
if(reviewLaunch())return{id:'core.status.review',kind:'warn',sym:'!'};
var blocked=fallbackFrom()==='browser'||(app.requestedBrowser&&fallbackFrom()!=='scorm');
return{id:blocked?'core.status.browser.blocked':'core.status.memory',kind:'warn',sym:'!'};
}
if(!saver.isLoaded())return{id:'core.status.paused',kind:'error',sym:'!'};
var st=s.state;
var time=timeText(app.savedAt);
if(app.notice==='superseded'||(st==='failed'&&(s.reason==='superseded'||s.detail==='superseded'))){
return{id:'core.status.superseded',kind:'error',sym:'!'};
}
if(st==='idle'&&app.textSeen&&isEmptyState(app.state))return{id:'core.status.emptykept',kind:'warn',sym:'!'};
if(m==='scorm'){
if(st==='saving')return{id:'core.status.scorm.saving',kind:'busy',sym:'…'};
if(st==='saved')return{id:'core.status.scorm.saved',vars:{time:time},kind:'ok',sym:'✓'};
if(st==='nearlimit')return{id:'core.status.scorm.nearlimit',vars:{time:time},kind:'warn',sym:'!'};
if(st==='failed')return{id:s.reason==='too_large'?'core.status.scorm.toolarge':'core.status.scorm.failed',kind:'error',sym:'!'};
return{id:'core.status.scorm.ready',kind:'ok',sym:'✓'};
}
if(st==='saving')return{id:'core.status.browser.saving',kind:'busy',sym:'…'};
if(st==='saved'||st==='nearlimit')return{id:'core.status.browser.saved',vars:{time:time},kind:'ok',sym:'✓'};
if(st==='failed')return{id:'core.status.browser.failed',kind:'error',sym:'!'};
return{id:'core.status.browser.ready',kind:'ok',sym:'✓'};
}

function loadFromAdapter(){
var adapter=app.adapter;
app.connecting=true;
app.phase='loading';
renderStatus();
renderLoading(app.issueFocus);
var p;
try{p=Promise.resolve(adapter.init());}catch(e){p=Promise.resolve({ok:false,error:String(e)});}
return p.catch(function(e){return{ok:false,error:String(e)};}).then(function(res){
app.connecting=false;
if(app.adapter!==adapter)return;
app.loadWarnings=[];
if(!res||!res.ok){
saver.markUnloaded();
showIssue('load-failed');
return;
}
app.initLocation=typeof res.location==='string'?res.location:null;
var hasWork=!isEmptyState(app.state);
var doc=typeof res.doc==='string'?res.doc:null;
if(!doc||!doc.trim()){
app.loadedEmpty=!hasWork;
saver.markLoaded();
runHooks('onLoad',[app.state,ctxFor(null)]);
if(hasWork){saver.changed();saver.flush('carry');}
ready();
return;
}
var loaded=docToState(doc);
if(!loaded.ok){
app.rawStored=doc;
saver.markUnloaded();
showIssue('unreadable');
return;
}
if(hasWork)app.carry=fullDoc();
app.state=loaded.state;
app.loadedEmpty=false;
app.rawStored=null;
if(!isEmptyState(loaded.state))app.textSeen=true;
app.loadWarnings=loadWarnings(loaded.parsed);
saver.markLoaded();
runHooks('onLoad',[app.state,ctxFor(null)]);
ready();
});
}

function defaultRouteKey(){

var openAt=app.state&&app.state.header?app.state.header.openAt:null;
if(openAt&&app.byRoute[openAt])return openAt;
if(app.initLocation&&app.byRoute[app.initLocation])return app.initLocation;
}
if(app.loadedEmpty)return'home';

function syncHookRows(announce){

next.forEach(function(r){

var sig=hookSig(r);

u.append(el('h3',{id:'wb-unknown-h',text:t('core.restore.unknown.heading')}),
el('p',{text:t(kind==='charter-v1'?'core.restore.charter.before':'core.restore.unknown.body')}));
var ul=el('ul');
uRows.forEach(function(ur,k){
var li=el('li',{'data-unknown-key':ur.key||''},el('div',{class:'side-text',text:String(ur.block)}));
if(ur.key&&ur.source==='pasted'){
var dflt='keep';
try{dflt=WB.restore.defaultChoice(ur)==='drop'?'drop':'keep';}catch(e){dflt='keep';}
if(ur.older)li.append(el('p',{class:'note',text:t('core.restore.unknown.older')}));
var ufs=el('fieldset',{class:'group compact','data-unknown':String(k)});
ufs.append(el('legend',{class:'visually-hidden',text:t('core.restore.unknown.legend',{n:k+1})}));
['keep','drop'].forEach(function(v){
var urid='wb-ru-'+k+'-'+v;
var r=el('input',{type:'radio',name:'wb-ru-'+k,id:urid,value:v});
r.checked=dflt===v;
ufs.append(el('label',{class:'opt',for:urid},r,el('span',{text:t(v==='keep'?'core.restore.unknown.keep':'core.restore.unknown.drop')})));
});
li.append(ufs);
unknownChoiceRows.push({key:ur.key,i:k});
}
ul.append(li);
});
u.append(ul);
box.append(u);
}
var warnings=Array.isArray(parsed.warnings)?parsed.warnings:[];
if(warnings.length){
var w=el('section',{class:'warnings','aria-labelledby':'wb-warn-h'});
w.append(el('h3',{id:'wb-warn-h',text:t('core.restore.warnings.heading')}));
var wl=el('ul');
warnings.forEach(function(x){wl.append(el('li',{text:warningText(x)}));});
w.append(wl);
box.append(w);
}
var applyBtn=el('button',{type:'button',class:'btn',id:'wb-restore-apply',text:t('core.restore.apply.button')});
applyBtn.addEventListener('click',function(){applyRestore(kind);});
box.append(el('div',{class:'row'},applyBtn));
}
function applyRestore(kind){
syncHookRows(false);
var cur=currentChoices();
var choices=cur.choices;
var missing=cur.missing;
var openHooks=hookRows.filter(function(h){return!Object.prototype.hasOwnProperty.call(cur.all,h.key);});
if(missing.length||openHooks.length){
var names=missing.map(function(m){return rowLabel(m.row,kind);}).concat(openHooks.map(function(h){return hookLegend(h.row);}));
WB.a11y.alertMsg(t('core.restore.needchoice',{sections:names.join(', ')}));
var first=missing.length?preview.querySelector('input[name="wb-rc-'+missing[0].i+'"]'):openHooks[0].el.querySelector('input[type="radio"]');
if(first)first.focus();
return;
}
var all=cur.all;
var next;
try{next=WB.restore.apply(app.state,parsed,all);}catch(e){next=null;}
if(!next){WB.a11y.alertMsg(t('core.restore.applyfailed'));return;}
runHooks('afterRestore',[next,{choices:all,parsed:parsed,kind:kind}]);
var wasCarry=app.carry&&previewedText===app.carry;
app.state=next;
app.loadedEmpty=false;
if(wasCarry)app.carry=null;
var used=Object.keys(choices).filter(function(k){return/^pasted(:\d+)?$/.test(String(choices[k]));});
var kept=Object.keys(choices).length-used.length;
if(!saver.isLoaded()&&app.adapter&&mode()!=='memory'&&!isEmptyState(next)){
saver.markLoaded();
app.rawStored=null;
if(app.issue)app.issue.dismissed=true;
app.phase='ready';
}
saver.changed();
saver.flush('restore');
renderStatus();
preview.textContent='';
paste.value=app.carry||'';
syncCarryNote();
summary.textContent='';
var msg=kind==='charter-v1'
?t('core.restore.charter.applied',{n:used.length,m:kept})
:t('core.restore.applied',{used:used.length,kept:kept});
var sh=el('h2',{id:'wb-restore-summary-h',tabindex:'-1',text:t('core.restore.summary.heading')});
summary.append(sh,el('p',{class:'restore-result',text:msg}));
if(used.length){
var ul=el('ul');
rows.forEach(function(row){if(/^pasted(:\d+)?$/.test(String(choices[rowKey(row)])))ul.append(el('li',{text:rowLabel(row,kind)}));});
summary.append(ul);
}
summary.append(el('p',null,el('a',{href:'#home',text:t('core.route.home')})));
WB.a11y.announce(msg);
WB.a11y.focusHeading(sh);
}
var move=el('section',{class:'panel','aria-labelledby':'wb-move-heading'});
move.append(el('h2',{id:'wb-move-heading',tabindex:'-1',text:t('core.move.heading')}));
move.append(el('p',{text:t('core.move.instructions')}));
WB.ui.renderCopyBox(move,{textFn:docText,labelKey:'core.move.copy.label'},ctxFor(null));
main.append(move);
if(app.carry&&!paste.value){
paste.value=app.carry;
runPreview(false);
}
syncCarryNote();
return title;
}
function withoutBlankValues(parsed){
var out=Object.assign({},parsed,{sections:{}});
function groupOf(fid){
try{return WB.registry.repeatKeyOf?WB.registry.repeatKeyOf(fid):null;}catch(e){return null;}
}
Object.keys(parsed.sections||{}).forEach(function(sid){
var s=parsed.sections[sid];
var snap=false;
try{snap=!!(WB.registry.isSnapshot&&WB.registry.isSnapshot(sid));}catch(e){snap=false;}
if(!s||!s.values||snap){out.sections[sid]=s;return;}
var values={};
Object.keys(s.values).forEach(function(fid){if(!WB.ui.isBlank(s.values[fid]))values[fid]=s.values[fid];});
if(!Object.keys(values).length)return;
var groups=Object.keys(values).map(groupOf).filter(Boolean);
var repeats={};
Object.keys(s.repeats||{}).forEach(function(k){if(groups.indexOf(k)>=0)repeats[k]=s.repeats[k];});
out.sections[sid]=Object.assign({},s,{
values:values,
flags:(Array.isArray(s.flags)?s.flags:[]).filter(function(f){return f&&Object.prototype.hasOwnProperty.call(values,f.fieldId);}),
repeats:repeats,
none:[]
});
});
return out;
}
function ownTabUrl(){
if(BUILD.OWN_TAB_URL&&/^https:\/\//.test(BUILD.OWN_TAB_URL))return BUILD.OWN_TAB_URL;
try{
var loc=root.location;
if(!/^https?:$/.test(loc.protocol))return null;
return loc.origin+loc.pathname+'?mode=browser';
}catch(e){return null;}
}
WB.app={
BUILD:BUILD,
createSaver:createSaver,
stageToShell:stageToShell,
withoutBlankValues:withoutBlankValues,
docToState:docToState,
practiceData:practiceData,
start:start,
connect:connect,
registerModules:registerModules,
routeForField:routeForField,
onStatus:onStatus,
saveStatus:saveStatus,
canvas:canvas,
ctxFor:ctxFor,
_today:null,
get state(){return app.state;},
get adapter(){return app.adapter;},
get phase(){return app.phase;},
get issue(){return app.issue;},
saver:saver,
_app:app
};
if(typeof document!=='undefined'&&!root.WB_NO_AUTOSTART){
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);
else start();
}
})();
</script>
